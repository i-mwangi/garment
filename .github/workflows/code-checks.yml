name: Code checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'contexts/**'
      - 'presentation/**'
      - 'services/**'
      - 'tests/**'
      - 'types/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/code-checks.yml'

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SETTLBOX_SERIAL_TYPECHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run source tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
